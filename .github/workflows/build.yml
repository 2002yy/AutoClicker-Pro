name: Test, Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Windows unit tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover tests -v

  build-windows:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build through the canonical packaging script
        run: python pack.py --ci

      - name: Validate executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\AutoClickerPro.exe')) {
            throw 'dist\AutoClickerPro.exe was not created'
          }
          $size = (Get-Item 'dist\AutoClickerPro.exe').Length
          if ($size -le 0) {
            throw 'AutoClickerPro.exe is empty'
          }
          Write-Host "Executable size: $size bytes"

      - name: Create release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item 'dist\AutoClickerPro.exe' 'release\AutoClickerPro.exe'
          Copy-Item 'README.md' 'release\README.md'
          Copy-Item 'docs\TUTORIAL.md' 'release\TUTORIAL.md'
          if (Test-Path 'LICENSE') {
            Copy-Item 'LICENSE' 'release\LICENSE'
          }
          Compress-Archive -Path 'release\*' -DestinationPath 'AutoClickerPro_Windows.zip' -Force
          if ((Get-Item 'AutoClickerPro_Windows.zip').Length -le 0) {
            throw 'Release ZIP is empty'
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash 'AutoClickerPro_Windows.zip' -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash 'dist\AutoClickerPro.exe' -Algorithm SHA256).Hash.ToLower()
          $lines = @(
            "$zipHash  AutoClickerPro_Windows.zip",
            "$exeHash  AutoClickerPro.exe"
          )
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding ascii
          Write-Host "ZIP  SHA256: $zipHash"
          Write-Host "EXE  SHA256: $exeHash"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            AutoClickerPro_Windows.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tested Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}. Expected a tag such as v1.0.1." >&2
            exit 1
          fi

          test -s artifacts/AutoClickerPro_Windows.zip
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AutoClicker Pro ${{ steps.version.outputs.version }}
          body: |
            Automated Windows release built from the canonical `pack.py` entrypoint.

            The unit-test job completed successfully before packaging. Download `AutoClickerPro_Windows.zip`, extract it, and run `AutoClickerPro.exe`.

            ## 校验完整性

            `SHA256SUMS.txt` 附于附件中。Windows PowerShell 验证：
            ```powershell
            Get-FileHash .\AutoClickerPro_Windows.zip -Algorithm SHA256
            ```

            ## 关于杀毒软件误报

            本程序包含键盘钩子（全局快捷键）、输入模拟（连点功能）与 PyInstaller 加壳三个特征，
            可能触发杀软启发式告警或 SmartScreen 提示，属已知误报。本程序**无网络通信、无遥测**，
            源码完全开放可自行审计；不放心可直接源码运行。详见仓库 TUTORIAL.md 的 FAQ。

            **请勿用于违反目标平台服务条款的自动化（如游戏作弊）。**
          files: |
            artifacts/AutoClickerPro_Windows.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
